<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant - Preset | Kumpulan Preset Alight Motion</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { ant: '#22c55e', antDark: '#16a34a', darkBg: '#030712' } } }
    }
  </script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans selection:bg-ant selection:text-gray-950 pb-24 antialiased">

  <!-- Header / Navbar Publik -->
  <header class="sticky top-0 z-40 bg-gray-950/80 backdrop-blur-xl border-b border-gray-800/80 px-4 sm:px-8 py-3.5 flex justify-between items-center shadow-xl shadow-black/40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-green-400 to-antDark flex items-center justify-center font-black text-gray-950 text-base shadow-lg shadow-green-500/25">ANT</div>
      <div>
        <h1 class="font-extrabold text-lg sm:text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-green-400 via-emerald-300 to-cyan-400">Ant - Preset</h1>
        <p class="text-[10px] text-gray-400 font-medium tracking-wide">ALIGHT MOTION CATALOG</p>
      </div>
    </div>
    <div class="text-xs text-gray-400 font-medium bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-xl">
      🔥 Free Preset
    </div>
  </header>

  <!-- Hero Section & Search Bar -->
  <section class="max-w-3xl mx-auto px-4 pt-12 pb-8 text-center">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-semibold mb-4">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
      <span>Katalog Resmi Jedag-Jedug & XML</span>
    </div>
    
    <h2 class="text-3xl sm:text-5xl font-black mb-4 text-white tracking-tight leading-tight">Temukan Preset Favoritmu</h2>
    <p class="text-gray-400 text-sm sm:text-base mb-8 max-w-lg mx-auto leading-relaxed">Pilih Alight Link (5MB) atau File XML. Tersedia preview video interaktif untuk tiap preset JJ!</p>

    <div class="relative max-w-lg mx-auto group">
      <div class="absolute -inset-1 bg-gradient-to-r from-green-500 to-cyan-500 rounded-2xl blur-md opacity-25 group-hover:opacity-50 transition duration-500"></div>
      <div class="relative flex items-center">
        <input type="text" id="searchInput" placeholder="Cari nomor preset (contoh: 12) atau judul..." 
          class="w-full bg-gray-900 border border-gray-800 rounded-2xl py-4 pl-12 pr-4 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-green-500 transition-all shadow-2xl">
        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-4"></i>
      </div>
    </div>
  </section>

  <!-- Filter Category Tags -->
  <div id="filterContainer" class="flex justify-center gap-2 mb-10 px-4 flex-wrap text-xs"></div>

  <!-- Main Catalog Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6">
    <div id="presetGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  </main>

  <div id="toastContainer" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="js/app.js"></script>
</body>
</html>
